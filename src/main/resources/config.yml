settings:
  currency-name: "Gems"
  currency-symbol: "✦"

  starting-balance: 0
  decimal-support: false

  max-balance: 1000000000

economy:
  enabled: true

  buy-enabled: true

  price-per-gem: 1500

  min-purchase: 1
  max-purchase: 10000

  use-vault: true

storage:
  type: SQLITE

  sqlite:
    file: data.db

leaderboard:
  enabled: true
  max-entries: 10
  update-interval: 60

shop:
  enabled: true

  confirm-purchase: true

  close-after-purchase: false

  prevent-creative-exploit: true

admin:
  op-access: true

  gui-editor: true

  auto-save: true

security:
  validate-rewards: true

  prevent-negative-balance: true

  prevent-duplicate-purchase: true

  log-transactions: true
