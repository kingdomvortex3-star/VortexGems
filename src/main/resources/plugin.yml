
name: VortexGems
version: 1.1.0
main: my.kingdomvortex.vortexgems.VortexGems
api-version: '26.3'
author: KingdomVortex
description: Gems Economy and Exchange System

depend:
  - Vault

softdepend:
  - PlaceholderAPI

commands:
  gems:
    description: Main Gems command
    aliases: [gem]
    usage: /gems

  gemsadmin:
    description: Gems administration
    aliases: [gadmin]
    usage: /gemsadmin

permissions:
  vortexgems.use:
    default: true
  vortexgems.admin:
    default: op
  vortexgems.editor:
    default: op
  vortexgems.give:
    default: op
  vortexgems.take:
    default: op
  vortexgems.set:
    default: op
  vortexgems.reload:
    default: op
  vortexgems.check:
    default: op
  vortexgems.pay:
    default: true
