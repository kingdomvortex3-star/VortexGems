
name: VortexGems Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'

      - name: Build VortexGems
        run: gradle clean shadowJar

      - name: Upload VortexGems JAR
        uses: actions/upload-artifact@v4
        with:
          name: VortexGems
          path: build/libs/*.jar
          if-no-files-found: error
